server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # OAuth providers return here with query parameters. Serve the SPA directly;
  # checking the on-disk callback directory would otherwise emit a port-losing 301.
  location = /auth/callback {
    try_files /index.html =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location = /auth/callback/ {
    try_files /index.html =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location = /sw.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
